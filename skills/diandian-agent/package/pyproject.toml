[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diandian-agent"
version = "0.2.0"
description = "Single-instance Diandian agent gateway for Vikunja v2"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "cryptography>=43", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
diandian-agent = "diandian_agent.cli:main"

[tool.setuptools.packages.find]
include = ["diandian_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
